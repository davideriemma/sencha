<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1260 860" width="1260" height="860" font-family="Helvetica, Arial, sans-serif" font-size="12">
<defs>
  <marker id="arr" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#333"/></marker>
  <marker id="arrR" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto"><path d="M0,0 L10,4 L0,8 z" fill="#B00020"/></marker>
  <marker id="arrB" markerWidth="10" markerHeight="8" refX="9" refY="4" orient="auto-start-reverse"><path d="M0,0 L10,4 L0,8 z" fill="#1f4e8c"/></marker>
  <style>
    .box{fill:#fff;stroke:#333;stroke-width:1.2}
    .dash{fill:#fff;stroke:#777;stroke-width:1.1;stroke-dasharray:5 4}
    .st{font-size:10px;fill:#555;font-style:italic}
    .t{font-weight:bold}
    .ln{stroke:#333;stroke-width:1.2;fill:none}
    .lnd{stroke:#777;stroke-width:1.1;fill:none;stroke-dasharray:5 4}
    .ctl{stroke:#B00020;stroke-width:1.6;fill:none}
    .spi{stroke:#1f4e8c;stroke-width:2.4;fill:none}
    .gray{fill:#777}
  </style>
</defs>
<rect width="1260" height="860" fill="#fff"/>
<text x="630" y="32" text-anchor="middle" font-size="16" class="t">Sencha (nome provvisorio): RoT dedicata + chip principale. Diagramma dei componenti</text>

<!-- ============ RoT package ============ -->
<rect x="20" y="56" width="520" height="624" rx="6" fill="#eef6ee" stroke="#2e7d32" stroke-width="1.6"/>
<text x="32" y="74" class="st">«subsystem»</text>
<text x="32" y="90" class="t" font-size="13">RoT: Ibex, bus TL-UL, IP OpenTitan</text>

<rect x="200" y="96" width="220" height="46" class="box"/>
<text x="310" y="110" text-anchor="middle" class="st">«cpu»</text>
<text x="310" y="124" text-anchor="middle" class="t">Ibex</text>
<text x="310" y="137" text-anchor="middle">RV32IMC, PMP (SecureIbex: fase 3)</text>
<line x1="300" y1="142" x2="300" y2="150" class="ln"/>

<rect x="290" y="150" width="20" height="462" fill="#c8e0c8" stroke="#2e7d32"/>
<text transform="translate(304,600) rotate(-90)" font-size="11" class="t">Crossbar TL-UL</text>

<!-- RoT rows: A x=40..270, B x=330..520 ; rows 160,226,292,358,424,490,556 (h=54) -->
<g>
  <rect x="40" y="160" width="230" height="54" class="box"/><text x="155" y="174" text-anchor="middle" class="st">«memory»</text><text x="155" y="189" text-anchor="middle" class="t">Boot ROM</text><text x="155" y="204" text-anchor="middle">verifica firma in SW · rom_ctrl: fase 2</text>
  <line x1="270" y1="187" x2="290" y2="187" class="ln"/>
  <rect x="330" y="160" width="190" height="54" class="box"/><text x="425" y="174" text-anchor="middle" class="st">«memory»</text><text x="425" y="189" text-anchor="middle" class="t">SRAM privata</text><text x="425" y="204" text-anchor="middle">sram_ctrl</text>
  <line x1="310" y1="187" x2="330" y2="187" class="ln"/>

  <rect x="40" y="226" width="230" height="54" class="box"/><text x="155" y="240" text-anchor="middle" class="st">«crypto»</text><text x="155" y="255" text-anchor="middle" class="t">hmac</text><text x="155" y="270" text-anchor="middle">SHA-256 / HMAC</text>
  <line x1="270" y1="253" x2="290" y2="253" class="ln"/>
  <rect x="330" y="226" width="190" height="54" class="box"/><text x="425" y="240" text-anchor="middle" class="st">«storage»</text><text x="425" y="255" text-anchor="middle" class="t">otp_ctrl (emulato)</text><text x="425" y="270" text-anchor="middle">hash pubkey, anti-rollback, LC</text>
  <line x1="310" y1="253" x2="330" y2="253" class="ln"/>

  <rect x="40" y="292" width="230" height="54" class="box"/><text x="155" y="306" text-anchor="middle" class="st">«lifecycle»</text><text x="155" y="321" text-anchor="middle" class="t">lc_ctrl (ridotto)</text><text x="155" y="336" text-anchor="middle">DEV / PROD / RMA, gating debug</text>
  <line x1="270" y1="319" x2="290" y2="319" class="ln"/>
  <rect x="330" y="292" width="190" height="54" class="box" stroke="#1f4e8c" stroke-width="2"/><text x="425" y="306" text-anchor="middle" class="st">«peripheral»</text><text x="425" y="321" text-anchor="middle" class="t">spi_device</text><text x="425" y="336" text-anchor="middle">modo TPM + flash passthrough</text>
  <line x1="310" y1="319" x2="330" y2="319" class="ln"/>

  <rect x="40" y="358" width="230" height="54" class="box"/><text x="155" y="372" text-anchor="middle" class="st">«peripheral»</text><text x="155" y="387" text-anchor="middle" class="t">rv_timer + aon_timer</text><text x="155" y="402" text-anchor="middle">tick, watchdog</text>
  <line x1="270" y1="385" x2="290" y2="385" class="ln"/>
  <rect x="330" y="358" width="190" height="54" class="box" stroke="#B00020" stroke-width="1.6"/><text x="425" y="372" text-anchor="middle" class="st">«peripheral»</text><text x="425" y="387" text-anchor="middle" class="t">gpio / rstmgr</text><text x="425" y="402" text-anchor="middle">HOST_RST_N, ROT_IRQ</text>
  <line x1="310" y1="385" x2="330" y2="385" class="ln"/>

  <rect x="40" y="424" width="230" height="54" class="dash"/><text x="155" y="438" text-anchor="middle" class="st">«fase 2»</text><text x="155" y="453" text-anchor="middle" class="t gray">alert_handler (ridotto)</text><text x="155" y="468" text-anchor="middle" class="gray">raccolta alert, reazione HW</text>
  <line x1="270" y1="451" x2="290" y2="451" class="lnd"/>
  <rect x="330" y="424" width="190" height="54" class="dash"/><text x="425" y="438" text-anchor="middle" class="st">«fase 2»</text><text x="425" y="453" text-anchor="middle" class="t gray">entropy_src › csrng › edn</text><text x="425" y="468" text-anchor="middle" class="gray">su FPGA: sorgente emulata</text>
  <line x1="310" y1="451" x2="330" y2="451" class="lnd"/>

  <rect x="40" y="490" width="230" height="54" class="dash"/><text x="155" y="504" text-anchor="middle" class="st">«fase 3»</text><text x="155" y="519" text-anchor="middle" class="t gray">keymgr, aes</text><text x="155" y="534" text-anchor="middle" class="gray">identità, sealing, cifratura link</text>
  <line x1="270" y1="517" x2="290" y2="517" class="lnd"/>
  <rect x="330" y="490" width="190" height="54" class="dash"/><text x="425" y="504" text-anchor="middle" class="st">«escluso su GateMate»</text><text x="425" y="519" text-anchor="middle" class="t gray">otbn</text><text x="425" y="534" text-anchor="middle" class="gray">ECC/RSA/PQC accelerati</text>
  <line x1="310" y1="517" x2="330" y2="517" class="lnd"/>

  <rect x="40" y="556" width="230" height="54" class="box"/><text x="155" y="570" text-anchor="middle" class="st">«peripheral»</text><text x="155" y="585" text-anchor="middle" class="t">spi_host</text><text x="155" y="600" text-anchor="middle">master unico della SPI flash</text>
  <line x1="270" y1="583" x2="290" y2="583" class="ln"/>
</g>
<text x="200" y="640" font-size="10">L'host non ha accesso al bus TL-UL della RoT: l'unico ingresso</text>
<text x="200" y="655" font-size="10">è il link SPI, i cui comandi sono validati dal firmware della RoT.</text>
<text x="200" y="670" font-size="10">Unità sempre attiva al reset: l'host parte solo su suo consenso.</text>

<!-- ============ Host package ============ -->
<rect x="700" y="56" width="520" height="624" rx="6" fill="#eef3fa" stroke="#1f4e8c" stroke-width="1.6"/>
<text x="712" y="74" class="st">«subsystem»</text>
<text x="712" y="90" class="t" font-size="13">Chip principale: VexRiscv, Wishbone, core LiteX</text>

<rect x="850" y="96" width="220" height="46" class="box"/>
<text x="960" y="110" text-anchor="middle" class="st">«cpu»</text>
<text x="960" y="124" text-anchor="middle" class="t">VexRiscv</text>
<text x="960" y="137" text-anchor="middle">RV32IM (variante secure: PMP)</text>
<line x1="960" y1="142" x2="960" y2="152" class="ln"/>
<rect x="890" y="152" width="140" height="32" class="dash"/>
<text x="960" y="172" text-anchor="middle" class="gray t">Bus Firewall «previsto»</text>
<line x1="960" y1="184" x2="960" y2="196" class="lnd"/>
<rect x="950" y="196" width="20" height="218" fill="#c9d8ee" stroke="#1f4e8c"/>
<text transform="translate(964,404) rotate(-90)" font-size="11" class="t">Wishbone 32 bit</text>

<!-- Host rows: A x=720..930, B x=990..1200 -->
<rect x="720" y="226" width="210" height="54" class="box"/><text x="825" y="240" text-anchor="middle" class="st">«memory»</text><text x="825" y="255" text-anchor="middle" class="t">ROM, SRAM, MAIN_RAM</text><text x="825" y="270" text-anchor="middle">boot stub, immagine Zephyr</text>
<line x1="930" y1="253" x2="950" y2="253" class="ln"/>
<rect x="990" y="226" width="210" height="54" class="box"/><text x="1095" y="240" text-anchor="middle" class="st">«peripheral»</text><text x="1095" y="255" text-anchor="middle" class="t">UART, Timer, GPIO</text><text x="1095" y="270" text-anchor="middle">Watchdog, ctrl</text>
<line x1="970" y1="253" x2="990" y2="253" class="ln"/>

<rect x="720" y="292" width="210" height="54" class="box" stroke="#1f4e8c" stroke-width="2"/><text x="825" y="306" text-anchor="middle" class="st">«peripheral»</text><text x="825" y="321" text-anchor="middle" class="t">SPI verso RoT</text><text x="825" y="336" text-anchor="middle">LiteSPI (CS_FLASH) + master (CS_TPM)</text>
<line x1="930" y1="319" x2="950" y2="319" class="ln"/>
<rect x="990" y="292" width="210" height="54" class="box"/><text x="1095" y="306" text-anchor="middle" class="st">«peripheral»</text><text x="1095" y="321" text-anchor="middle" class="t">SPI master (litex,spi)</text><text x="1095" y="336" text-anchor="middle">ADC esterni, memorie</text>
<line x1="970" y1="319" x2="990" y2="319" class="ln"/>

<rect x="720" y="358" width="210" height="54" class="box" stroke="#B00020" stroke-width="1.6"/><text x="825" y="372" text-anchor="middle" class="st">«clock/reset»</text><text x="825" y="387" text-anchor="middle" class="t">CRG + GPIO IRQ</text><text x="825" y="402" text-anchor="middle">reset da RoT, ROT_IRQ in ingresso</text>
<line x1="930" y1="385" x2="950" y2="385" class="ln"/>
<rect x="990" y="358" width="210" height="54" class="box"/><text x="1095" y="372" text-anchor="middle" class="st">«networking»</text><text x="1095" y="387" text-anchor="middle" class="t">LiteEth MAC</text><text x="1095" y="402" text-anchor="middle">alternativa: W5500 / ENC28J60 su SPI</text>
<line x1="970" y1="385" x2="990" y2="385" class="ln"/>

<rect x="720" y="440" width="210" height="104" class="dash"/>
<text x="825" y="456" text-anchor="middle" class="st">«software»</text>
<text x="825" y="472" text-anchor="middle" class="t">Firmware host</text>
<text x="825" y="489" text-anchor="middle">boot stub → MCUboot → Zephyr</text>
<text x="825" y="505" text-anchor="middle">app utente invariata (API PSA)</text>
<text x="825" y="521" text-anchor="middle">driver PSA opaco → mailbox RoT</text>
<text x="825" y="537" text-anchor="middle" class="st">generato con board e overlay</text>

<text x="712" y="640" font-size="11">Core LiteX con driver Zephyr upstream (litex,spi, liteeth, uart,</text>
<text x="712" y="655" font-size="11">timer0, gpio, watchdog). L'app Zephyr esistente si ricompila</text>
<text x="712" y="670" font-size="11">per la board generata senza modifiche al codice.</text>

<!-- ============ Inter-chip link ============ -->
<line x1="720" y1="319" x2="530" y2="319" class="spi" marker-end="url(#arrB)"/>
<text x="625" y="300" text-anchor="middle" font-size="11" class="t" fill="#1f4e8c">Link SPI</text>
<text x="625" y="313" text-anchor="middle" font-size="10" fill="#1f4e8c">CS_TPM: mailbox (TCG PTP)</text>
<text x="625" y="336" text-anchor="middle" font-size="10" fill="#1f4e8c">CS_FLASH: passthrough filtrato</text>

<line x1="520" y1="378" x2="718" y2="378" class="ctl" marker-end="url(#arrR)"/>
<text x="625" y="372" text-anchor="middle" font-size="10" fill="#B00020">HOST_RST_N (reset gating)</text>
<line x1="520" y1="394" x2="718" y2="394" class="ctl" marker-end="url(#arrR)"/>
<text x="625" y="408" text-anchor="middle" font-size="10" fill="#B00020">ROT_IRQ (risposta pronta)</text>

<!-- ============ External devices ============ -->
<line x1="155" y1="610" x2="155" y2="722" class="ln" marker-end="url(#arr)"/>
<path d="M70,728 a85,8 0 0 0 170,0 v40 a85,8 0 0 1 -170,0 z" fill="#fff" stroke="#333"/>
<ellipse cx="155" cy="728" rx="85" ry="8" fill="#fff" stroke="#333"/>
<text x="155" y="756" text-anchor="middle" class="t">SPI flash</text>
<text x="155" y="771" text-anchor="middle" font-size="11">immagini firmate (host + RoT)</text>

<line x1="1010" y1="412" x2="1010" y2="718" class="ln" marker-end="url(#arr)"/>
<rect x="940" y="720" width="140" height="50" class="box"/><text x="1010" y="742" text-anchor="middle" class="t">PHY Ethernet</text><text x="1010" y="758" text-anchor="middle" font-size="11">RMII / modulo PMOD</text>

<path d="M1200,330 H1238 V700 H1170 V718" class="ln" marker-end="url(#arr)"/>
<rect x="1100" y="720" width="140" height="50" class="box"/><text x="1170" y="742" text-anchor="middle" class="t">ADC / memorie</text><text x="1170" y="758" text-anchor="middle" font-size="11">dispositivi SPI esterni</text>

<!-- ============ Legend ============ -->
<line x1="30" y1="815" x2="70" y2="815" class="ln"/><text x="78" y="819">prima versione</text>
<line x1="190" y1="815" x2="230" y2="815" class="lnd"/><text x="238" y="819">fase successiva / escluso per area</text>
<line x1="470" y1="815" x2="510" y2="815" class="spi"/><text x="518" y="819">link dati inter-chip (SPI, 2 chip select)</text>
<line x1="790" y1="815" x2="830" y2="815" class="ctl"/><text x="838" y="819">segnali di controllo (sideband)</text>
<text x="30" y="845" font-size="11" fill="#555">Su FPGA le due entità sono due domini isolati nello stesso fabric (o due schede); il modello software è identico al caso a due chip.</text>
</svg>
